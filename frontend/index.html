<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="An interactive visualizer for learning algorithms." />
  <title>Algorithm Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-container">
    <header class="hero">
      <p class="eyebrow">Learn by watching</p>
      <h1>Algorithm Visualizer</h1>
      <p class="subtitle">
        Explore how popular sorting algorithms transform an array, one step at a time.
      </p>
    </header>

    <section class="control-card" aria-label="Visualizer controls">
      <div class="control-group">
        <label for="algorithm-select">Algorithm</label>
        <select id="algorithm-select" name="algorithm">
          <option value="bubble">Bubble Sort</option>
          <option value="selection">Selection Sort</option>
          <option value="insertion">Insertion Sort</option>
          <option value="merge">Merge Sort</option>
          <option value="quick">Quick Sort</option>
        </select>
      </div>

      <div class="control-group speed-control">
        <label for="speed-slider">Animation speed <span id="speed-value">50%</span></label>
        <input id="speed-slider" type="range" min="1" max="100" value="50" />
      </div>

      <div class="button-group">
        <button id="start-button" class="button button-primary" type="button">Start</button>
        <button id="reset-button" class="button button-secondary" type="button">Reset</button>
      </div>
    </section>

    <section class="visualization-card" aria-labelledby="visualization-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Array view</p>
          <h2 id="visualization-heading">Visualization</h2>
        </div>
        <p id="array-status" class="array-status">30 values ready</p>
      </div>
      <div id="array-container" class="array-container" aria-label="Array visualization"></div>
    </section>

    <section class="statistics-section" aria-labelledby="statistics-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Performance</p>
          <h2 id="statistics-heading">Statistics</h2>
        </div>
      </div>

      <div class="statistics-grid">
        <article class="stat-card">
          <span class="stat-label">Comparisons</span>
          <strong id="comparisons">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Swaps</span>
          <strong id="swaps">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Time Complexity</span>
          <strong id="time-complexity">—</strong>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
